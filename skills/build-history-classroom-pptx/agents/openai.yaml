interface:
  display_name: "高中历史课堂课件制作"
  short_description: "允许教师后补媒体，优先保证信息密度和完整课堂认知链"
  brand_color: "#1E869F"
  default_prompt: "Use $build-history-classroom-pptx to create a native high-school history PPTX. Prioritize a complete evidence-task-processing-answer-conclusion classroom chain over formal compliance. Distinguish the opening anchor from the teaching throughline, move curriculum-standard pages to a hidden appendix, reject unverified student-facing materials, use semantic L1/L2/L3 titles, and never call a placeholder deck classroom-ready. Prefer the local private dark cloud-school template when present, never add a note prompt, page number, internal production label, or generic thank-you slide, and run classroom-readiness, audience-view, animation, overflow, residue, and style QA on the exact delivered file."
